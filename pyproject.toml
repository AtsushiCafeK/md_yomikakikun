[project]
name = "md-yomikakikun"
version = "0.1.0"
description = ""
authors = [
    {name = "Atsushi",email = "atsushi.shindo@it-libero.jp"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pyqt6 (>=6.11.0,<7.0.0)",
    "pyqt6-webengine (>=6.11.0,<7.0.0)",
    "markdown (>=3.10.2,<4.0.0)",
    "pymdown-extensions (>=10.21.2,<11.0.0)",
    "pygments (>=2.20.0,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pyinstaller (>=6.20.0,<7.0.0)"
]

[tool.poetry]
packages = [{include = "md_yomikakikun", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
